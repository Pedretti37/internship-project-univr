{% extends "base.html" %}

{% block css %}
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/login.css">
{% endblock %}

{% block content %}
    <div class="page-container">
        <div class="form-container">
            <h1>Login as Individual User</h1>

            {% if error %}
                <div class="error-banner" style="background-color: #ffdddd; color: red; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
                    {{ error }}
                </div>
            {% endif %}

            <form action="/user_login" method="POST" class="auth-form" autocomplete="off">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Login</button>
            </form>

            <hr class="hr">

            <div class="register">
                <a href="/user_register">Don't have an account? Register here!</a>
            </div>

            <div class="back-link">
                <small><a href="/">← Back to Welcome Page</a></small>
            </div>
        </div>

        <div class="esco-conditions">
            <div class="partners logos">
                <img src="/static/img/CEDEFOP_logo.png" alt="CEDEFOP Logo" class="logo-cedefop">
                <img src="/static/img/DataGEMS_logo.png" alt="DataGEMS Logo" class="logo-datagems">
            </div>
            <p>This service uses the ESCO classification of the European Commission.</p>
        </div>
    </div>

    <script>
        window.addEventListener('pageshow', function(event) {
            // inputs cleaner
            var form = document.querySelector('.auth-form');
            if (form) {
                form.reset(); // reset form fields
            }
        });
    </script>
{% endblock %}
