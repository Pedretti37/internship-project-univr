{% extends "base.html" %}

{% block css %}
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/register.css">
    <link rel="stylesheet" href="/static/css/footer.css">
{% endblock %}

{% block content %}
    <div class="page-container">
        <div class="card">
            {% if error %}
                <div class="error-banner" style="background-color: #ffdddd; color: red; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
                    {{ error }}
                </div>
            {% endif %}

            <h1>Create your Account</h1>

            <form action="/org_register" method="POST" class="reg-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="orgname">Orgname:</label>
                <input type="text" id="orgname" name="orgname" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Register</button>
            </form>

            <div class="back-link">
                <small><a href="/org_login">← Back to Login Page</a></small>
            </div>
        </div>

        {% include "_footer.html" %}
    </div>

    <script>
        window.addEventListener('pageshow', function(event) {
            // inputs cleaner
            var form = document.querySelector('.reg-form');
            if (form) {
                form.reset(); // reset form fields
            }
        });
    </script>

{% endblock %}
